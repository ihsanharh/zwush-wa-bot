name: Build & Deploy zwush-wa-bot

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_USER: ${{ secrets.VPS_USER }}
      VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/zwush-wa-bot
          tags: |
            type=raw,value=latest
            type=sha,format=short

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deploy to VPS via SSH
        if: env.VPS_HOST != '' && env.VPS_USER != '' && env.VPS_SSH_KEY != ''
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            COMPOSE_DIR=""
            if [ -f "docker-compose.yml" ] || [ -f "compose.yaml" ]; then
              COMPOSE_DIR="."
            elif [ -f "zwushmc/docker-compose.yml" ]; then
              COMPOSE_DIR="zwushmc"
            elif [ -f "$HOME/zwushmc/docker-compose.yml" ]; then
              COMPOSE_DIR="$HOME/zwushmc"
            elif [ -f "/opt/zwushmc/docker-compose.yml" ]; then
              COMPOSE_DIR="/opt/zwushmc"
            else
              FOUND=$(find "$HOME" -maxdepth 3 -name "docker-compose.yml" 2>/dev/null | head -n 1)
              if [ -n "$FOUND" ]; then
                COMPOSE_DIR=$(dirname "$FOUND")
              fi
            fi

            if [ -n "$COMPOSE_DIR" ]; then
              cd "$COMPOSE_DIR"
              echo "Deploying in: $(pwd)"
            else
              echo "❌ Error: docker-compose.yml not found on VPS!"
              echo "Please ensure ~/zwushmc/docker-compose.yml exists on your VPS."
              exit 1
            fi

            if [ -n "${{ secrets.GHCR_PAT }}" ]; then
              echo "${{ secrets.GHCR_PAT }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            fi
            docker compose pull zwush-wa-bot
            docker compose up -d --no-deps zwush-wa-bot
